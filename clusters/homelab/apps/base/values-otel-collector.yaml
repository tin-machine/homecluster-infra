mode: daemonset
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.102.1
  pullPolicy: IfNotPresent

# Chart-only upgrade: keep the pinned Collector's component names and telemetry.
# Remove these compatibility settings together with a tested application upgrade.
rewriteDeprecatedComponentNames: false

# Chart 0.178.x builds internal telemetry resource attributes from a separate
# values key, even when config.service.telemetry.resource is null. Disable its
# defaults while the Collector application remains pinned to 0.102.1. This is
# a chart-only upgrade; migrate the Collector and its telemetry separately.
telemetry:
  resourceAttributes:
    default:
      host.name:
        enabled: false
      k8s.namespace.name:
        enabled: false
      k8s.node.ip:
        enabled: false
      k8s.node.name:
        enabled: false
      k8s.pod.ip:
        enabled: false
      k8s.pod.name:
        enabled: false
config:
  service:
    telemetry:
      resource: null
      metrics:
        readers: null
        address: ${env:MY_POD_IP}:8888

serviceAccount:
  create: true
service:
  enabled: true
  type: ClusterIP
  annotations: {}

podLabels:
  app.kubernetes.io/part-of: observability

additionalLabels:
  app.kubernetes.io/part-of: observability

extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  - name: host-proc
    hostPath:
      path: /proc
      type: Directory
  - name: host-sys
    hostPath:
      path: /sys
      type: Directory
  - name: host-run
    hostPath:
      path: /run
      type: Directory
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: host-proc
    mountPath: /host/proc
    readOnly: true
  - name: host-sys
    mountPath: /host/sys
    readOnly: true
  - name: host-run
    mountPath: /host/run
    readOnly: true
