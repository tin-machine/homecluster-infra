# Dedicated journal reader. Existing OTel Collector handles authentication and
# delivery to prod; the local Service routes to a Collector on the same node.
kind: DaemonSet
image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 5.1.3
serviceAccount:
  create: false
  name: default
  automountServiceAccountToken: false
rbac:
  create: false
nodeSelector: {}
tolerations:
  - operator: Exists
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
daemonSetVolumes:
  - name: journal
    hostPath:
      path: /run/log/journal
      type: Directory
  - name: machine-id
    hostPath:
      path: /etc/machine-id
      type: File
  - name: state
    emptyDir: {}
daemonSetVolumeMounts:
  - name: journal
    mountPath: /run/log/journal
    readOnly: true
  - name: machine-id
    mountPath: /etc/machine-id
    readOnly: true
  - name: state
    mountPath: /var/fluent-bit/state
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
  inputs: |
    [INPUT]
        Name systemd
        Tag journal.host
        Path /run/log/journal
        DB /var/fluent-bit/state/journal.db
        Read_From_Tail On
        Max_Entries 1000
        Mem_Buf_Limit 20MB
  filters: ""
  outputs: |
    [OUTPUT]
        Name opentelemetry
        Match journal.*
        Host stg-otel-collector-opentelemetry-collector.observability-stg.svc.cluster.local
        Port 4318
        Logs_uri /v1/logs
        Logs_Body_Key MESSAGE
        Logs_Body_Key_Attributes On
        Retry_Limit 5
  customParsers: ""
