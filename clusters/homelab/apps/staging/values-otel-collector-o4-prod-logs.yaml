# Opt-in O4: send staging Pod and OpenWrt logs to the authenticated prod gateway.
# The operator must create the fixed owner-only Secret before enabling this overlay.
# The private site values select only workload nodes. Clear that selector so this
# DaemonSet also covers the staging control-plane node and its Pod logs.
nodeSelector: null
tolerations:
  - operator: Exists
    effect: NoSchedule
config:
  processors:
    resource/openwrt-security:
      attributes:
        - key: service.name
          value: openwrt-security
          action: upsert
        - key: security_source
          value: openwrt
          action: upsert
    transform/openwrt-security:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - attributes["appname"] == "homecluster-security"
          statements:
            - set(attributes["security_parser_status"], "invalid")
            # Native syslog body includes the RFC3164 header. The parsed
            # message attribute contains the JSON envelope from the monitor.
            - merge_maps(cache, ParseJSON(attributes["message"]), "upsert")
            - set(cache["valid"], false)
            - set(cache["valid"], true) where cache["schema"] == 1 and cache["security_source"] == "openwrt" and cache["log_type"] == "heartbeat" and IsString(cache["sensor"]) and IsMatch(cache["sensor"], "^[a-z0-9][a-z0-9_.-]{0,63}$")
            - set(attributes["sensor"], cache["sensor"]) where cache["valid"] == true
            - set(attributes["log_type"], "heartbeat") where cache["valid"] == true
            - set(attributes["banip_status"], cache["banip_status"]) where cache["valid"] == true and IsString(cache["banip_status"])
            - set(attributes["banip_run_age_seconds"], cache["banip_run_age_seconds"]) where cache["valid"] == true and (IsInt(cache["banip_run_age_seconds"]) or IsDouble(cache["banip_run_age_seconds"])) and cache["banip_run_age_seconds"] >= 0
            - set(attributes["banip_feed_verification"], cache["banip_feed_verification"]) where cache["valid"] == true and IsString(cache["banip_feed_verification"])
            - set(attributes["security_parser_status"], "ok") where cache["valid"] == true
    batch/o4-prod-logs:
      send_batch_size: 128
      send_batch_max_size: 256
      timeout: 2s
    resource/journal:
      attributes:
        - key: service.name
          value: staging-journal
          action: upsert
        - key: host.name
          from_attribute: _HOSTNAME
          action: upsert
  exporters:
    otlphttp/prod-logs:
      endpoint: ${env:PROD_LOKI_OTLP_BASE}
      headers:
        Authorization: Basic ${env:PROD_LOKI_BASIC_B64}
      tls:
        ca_file: /etc/otel/prod-loki-ca/ca.crt
      timeout: 10s
      sending_queue:
        enabled: true
        num_consumers: 1
        queue_size: 32
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 15s
        max_elapsed_time: 1m
  service:
    pipelines:
      logs:
        receivers: [filelog/pods]
        processors: [resource/environment, batch/o4-prod-logs]
        exporters: [otlphttp/prod-logs]
      "logs/openwrt":
        receivers: [syslog/openwrt]
        processors: [attributes/openwrt, resource/environment, resource/openwrt-security, transform/openwrt-security, batch/o4-prod-logs]
        exporters: [otlphttp/prod-logs]
      "logs/journal":
        receivers: [otlp]
        processors: [resource/environment, resource/journal, batch/o4-prod-logs]
        exporters: [otlphttp/prod-logs]

extraEnvs:
  - name: PROD_LOKI_OTLP_BASE
    valueFrom:
      secretKeyRef:
        name: staging-prod-loki-push
        key: endpoint
  - name: PROD_LOKI_BASIC_B64
    valueFrom:
      secretKeyRef:
        name: staging-prod-loki-push
        key: basic_authorization_b64

# Helm replaces arrays. Keep the existing host mounts alongside the O4 CA.
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  - name: host-proc
    hostPath:
      path: /proc
      type: Directory
  - name: host-sys
    hostPath:
      path: /sys
      type: Directory
  - name: host-run
    hostPath:
      path: /run
      type: Directory
  - name: prod-loki-ca
    secret:
      secretName: staging-prod-loki-push
      items:
        - key: ca.crt
          path: ca.crt

extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: host-proc
    mountPath: /host/proc
    readOnly: true
  - name: host-sys
    mountPath: /host/sys
    readOnly: true
  - name: host-run
    mountPath: /host/run
    readOnly: true
  - name: prod-loki-ca
    mountPath: /etc/otel/prod-loki-ca
    readOnly: true
