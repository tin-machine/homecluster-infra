---
- name: banIP 定期更新だけを root crontab に反映
  ansible.builtin.cron:
    name: homecluster-banip-refresh
    user: root
    minute: "{{ openwrt_banip_refresh_minute }}"
    hour: "{{ openwrt_banip_refresh_hour }}"
    job: "{{ openwrt_banip_feed_verification_enabled | ternary('/usr/libexec/homecluster-banip-feed-proof.py refresh --config /etc/homecluster-security/banip-proof.json', '/etc/init.d/banip reload') }}"
    state: "{{ (openwrt_banip_enabled | bool and openwrt_banip_refresh_enabled) | ternary('present', 'absent') }}"
  register: openwrt_banip_refresh_cron

- name: cron の自動起動を有効化
  ansible.builtin.shell: |
    if /etc/init.d/cron enabled; then
      exit 0
    fi
    /etc/init.d/cron enable
    echo enabled
  args:
    executable: /bin/ash
  register: openwrt_banip_refresh_cron_enable
  changed_when: "'enabled' in openwrt_banip_refresh_cron_enable.stdout"
  when:
    - not ansible_check_mode
    - openwrt_banip_enabled | bool
    - openwrt_banip_refresh_enabled

- name: cron を起動
  ansible.builtin.shell: |
    if /etc/init.d/cron running; then
      exit 0
    fi
    /etc/init.d/cron start
    echo started
  args:
    executable: /bin/ash
  register: openwrt_banip_refresh_cron_start
  changed_when: "'started' in openwrt_banip_refresh_cron_start.stdout"
  when:
    - not ansible_check_mode
    - openwrt_banip_enabled | bool
    - openwrt_banip_refresh_enabled

- name: cron の起動状態を確認
  ansible.builtin.command: /etc/init.d/cron running
  register: openwrt_banip_refresh_cron_running
  changed_when: false
  failed_when: openwrt_banip_refresh_cron_running.rc not in [0, 1]
  when: not ansible_check_mode

- name: crontab 変更時だけ起動中の cron を再読込
  ansible.builtin.command: /etc/init.d/cron reload
  changed_when: true
  when:
    - not ansible_check_mode
    - openwrt_banip_refresh_cron.changed
    - openwrt_banip_refresh_cron_running.rc == 0
