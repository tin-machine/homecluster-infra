---
openwrt_banip_install: false
openwrt_banip_enabled: false
openwrt_banip_install_luci: false

openwrt_banip_feeds: []
openwrt_banip_autodetect: true
openwrt_banip_blockpolicy: drop
openwrt_banip_loginbound: false
openwrt_banip_logoutbound: false
openwrt_banip_logprerouting: false
openwrt_banip_nftcount: false

# reload refreshes remote feeds; start/restart may restore cached backups.
openwrt_banip_refresh_enabled: false
openwrt_banip_refresh_hour: 4
openwrt_banip_refresh_minute: 17
openwrt_banip_feed_verification_enabled: false
