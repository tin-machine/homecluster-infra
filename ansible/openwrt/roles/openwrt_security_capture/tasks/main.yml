---
- name: Security capture の有効化入力を検証
  ansible.builtin.assert:
    that: openwrt_security_capture_enabled is boolean

- name: Security capture reader 公開鍵の形式を検証
  ansible.builtin.assert:
    that:
      - openwrt_security_capture_reader_public_key is string
      - openwrt_security_capture_reader_public_key | length <= 256
      - openwrt_security_capture_reader_public_key == '' or openwrt_security_capture_reader_public_key is match('^ssh-ed25519 [A-Za-z0-9+/]{68}( [a-zA-Z0-9@._-]{1,64})?\Z')
  no_log: true

- name: Security capture init の存在を確認
  ansible.builtin.stat:
    path: /etc/init.d/homecluster-security-capture
  register: openwrt_security_capture_init

- name: Security capture の現在の起動状態を確認
  ansible.builtin.command: /etc/init.d/homecluster-security-capture running
  register: openwrt_security_capture_running
  changed_when: false
  failed_when: openwrt_security_capture_running.rc not in [0, 1]
  when:
    - openwrt_security_capture_init.stat.exists
    - not ansible_check_mode

- name: Security capture 無効化時に実行中のcaptureを停止
  ansible.builtin.command: /etc/init.d/homecluster-security-capture stop
  changed_when: true
  when:
    - not openwrt_security_capture_enabled
    - openwrt_security_capture_running.rc | default(1) == 0
    - not ansible_check_mode

- name: Security capture を構成
  when: openwrt_security_capture_enabled
  block:
    - name: Security capture のprofile数を検証
      ansible.builtin.assert:
        that:
          - openwrt_security_capture_profiles is mapping
          - openwrt_security_capture_profiles | length >= 1
          - openwrt_security_capture_profiles | length <= 8
      no_log: true

    - name: 実行中captureの設定差替えを拒否
      ansible.builtin.assert:
        that: openwrt_security_capture_running.rc | default(1) != 0
        fail_msg: 実行中のbounded captureの終了後に再適用してください。

    - name: Security capture の依存packageを導入
      ansible.builtin.include_role:
        name: openwrt_package
      vars:
        openwrt_package_names: [python3, tcpdump]
        openwrt_package_state: present
        openwrt_package_update_cache: false

    - name: Security capture helper directory を作成
      ansible.builtin.file:
        path: /usr/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Security capture helper を配置
      ansible.builtin.copy:
        src: security_capture.py
        dest: /usr/libexec/homecluster-security-capture.py
        owner: root
        group: root
        mode: '0755'

    - name: Security capture の固定profileを検証して配置
      ansible.builtin.template:
        src: config.json.j2
        dest: /etc/homecluster-security-capture.json
        owner: root
        group: root
        mode: '0600'
        validate: /usr/bin/python3 /usr/libexec/homecluster-security-capture.py validate %s
      diff: false
      no_log: true

    - name: Security capture procd unit を配置
      ansible.builtin.template:
        src: service.init.j2
        dest: /etc/init.d/homecluster-security-capture
        owner: root
        group: root
        mode: '0755'

    - name: 固定profile専用capture-shortを配置
      ansible.builtin.copy:
        src: capture-short
        dest: /usr/sbin/capture-short
        owner: root
        group: root
        mode: '0755'

- name: Security capture のboot自動起動を無効化
  ansible.builtin.shell: |
    if /etc/init.d/homecluster-security-capture enabled; then
      /etc/init.d/homecluster-security-capture disable
      echo disabled
    fi
  args:
    executable: /bin/ash
  register: openwrt_security_capture_disable
  changed_when: "'disabled' in openwrt_security_capture_disable.stdout"
  when:
    - openwrt_security_capture_enabled or openwrt_security_capture_init.stat.exists
    - not ansible_check_mode

- name: Security capture 無効化時に受付用設定を除去
  ansible.builtin.file:
    path: /etc/homecluster-security-capture.json
    state: absent
  when: not openwrt_security_capture_enabled

- name: Security capture reader の既存authorized_keysを確認
  ansible.builtin.stat:
    path: /etc/dropbear/authorized_keys
  register: openwrt_security_capture_reader_keys

- name: Security capture reader の管理blockの有無だけ確認
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        from pathlib import Path; import sys;
        sys.exit(0 if b'# BEGIN HOMECLUSTER SECURITY CAPTURE READER' in Path('/etc/dropbear/authorized_keys').read_bytes() else 1)
  register: openwrt_security_capture_reader_marker
  changed_when: false
  failed_when: openwrt_security_capture_reader_marker.rc not in [0, 1]
  check_mode: false
  when:
    - openwrt_security_capture_reader_keys.stat.isreg | default(false)
    - not (openwrt_security_capture_reader_keys.stat.islnk | default(false))

- name: Security capture reader の保護された既存key fileを検証
  ansible.builtin.assert:
    that:
      - openwrt_security_capture_reader_keys.stat.exists
      - openwrt_security_capture_reader_keys.stat.isreg | default(false)
      - not (openwrt_security_capture_reader_keys.stat.islnk | default(false))
      - openwrt_security_capture_reader_keys.stat.uid | default(-1) == 0
      - openwrt_security_capture_reader_keys.stat.mode | default('') == '0600'
  when:
    - (openwrt_security_capture_enabled and openwrt_security_capture_reader_public_key | length > 0) or openwrt_security_capture_reader_marker.rc | default(1) == 0

- name: Dropbear の固定read-only command契約を検証
  ansible.builtin.command: /usr/bin/python3 /usr/libexec/homecluster-security-capture.py validate-reader
  changed_when: false
  when:
    - openwrt_security_capture_enabled
    - openwrt_security_capture_reader_public_key | length > 0
    - not ansible_check_mode

- name: 完了済みcapture専用のread-only SSH鍵を管理
  ansible.builtin.blockinfile:
    path: /etc/dropbear/authorized_keys
    create: false
    marker: '# {mark} HOMECLUSTER SECURITY CAPTURE READER'
    state: "{{ (openwrt_security_capture_enabled and openwrt_security_capture_reader_public_key | length > 0) | ternary('present', 'absent') }}"
    owner: root
    group: root
    mode: '0600'
    block: >-
      no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty,command="/usr/bin/python3 /usr/libexec/homecluster-security-capture.py ssh-export" {{ openwrt_security_capture_reader_public_key }}
  no_log: true
  when:
    - openwrt_security_capture_reader_keys.stat.exists
    - (openwrt_security_capture_enabled and openwrt_security_capture_reader_public_key | length > 0) or openwrt_security_capture_reader_marker.rc | default(1) == 0
