---
- name: Gentoo PXE paired clean release bundle build
  hosts: openwrt
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/openwrt.yml
  vars:
    # The common-kernel staging wrapper imports this generic build playbook.
    openwrt_gentoo_host_tailscale_enabled: "{{ pxe_release_bundle_stage | default('') == 'stg' }}"

  pre_tasks:
    - name: OpenWrt Python bootstrap を適用
      ansible.builtin.include_role:
        name: bootstrap_python

    - name: PXE release bundle build 入力を準備
      ansible.builtin.import_tasks: tasks/pxe_release_bundle_prepare.yml

    - name: PXE release bundle build既存releaseの再buildをpreflight
      ansible.builtin.import_tasks: tasks/pxe_release_bundle_immutable_preflight.yml
      vars:
        pxe_release_bundle_immutable_date: "{{ pxe_release_bundle_effective_date }}"


  tasks:
    - name: PXE release bundle build と manifest 検証を実行
      ansible.builtin.import_tasks: tasks/pxe_release_bundle_build_and_manifest.yml

    - name: 最終build artifactのproducer receiptを発行
      ansible.builtin.include_role:
        name: openwrt_gentoo_rootfs
        tasks_from: producer_receipt
        apply:
          tags:
            - pxe_release_bundle
            - pxe_release_bundle_build
      when: openwrt_gentoo_release_producer_enabled | default(false) | bool
      tags:
        - pxe_release_bundle
        - pxe_release_bundle_build
