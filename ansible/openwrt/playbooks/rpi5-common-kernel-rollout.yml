---
- name: Pi5 common kernel fixed PXE selector rollout
  hosts: openwrt
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/openwrt.yml
  tasks:
    - name: Pi5 common kernel rollout inputを検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_rollout_phase in ['generic_canary', 'egpu_canary', 'fleet_rollout', 'full_fleet', 'rollback_last_phase']
          - homecluster_common_kernel_rollout_output | string is match('^/tmp/homecluster-common-kernel-rollout-[A-Za-z0-9._/-]+/result.json$')
          - homecluster_common_kernel_rollout_targets is iterable
          - homecluster_common_kernel_rollout_targets | length > 0
          - homecluster_common_kernel_accepted_generation_run_id | string is match('^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+$')
          - homecluster_common_kernel_exact_release | string is match('^.+-v8-homecluster\\+$')
          - homecluster_common_kernel_accepted_selector | string is match('^[0-9]{8}-rpi5$')
          - >-
            homecluster_common_kernel_rollout_phase == 'rollback_last_phase'
            or (homecluster_common_kernel_accepted_kernel_artifact_id | default('', true) | string is match('^sha256:[0-9a-f]{64}$'))
          - >-
            homecluster_common_kernel_rollout_phase == 'rollback_last_phase'
            or (homecluster_common_kernel_accepted_kernel_artifact_manifest_sha256 | default('', true) | string is match('^[0-9a-f]{64}$'))
          - >-
            homecluster_common_kernel_rollout_phase == 'rollback_last_phase'
            or (homecluster_common_kernel_accepted_kernel_artifact_payload_sha256 | default('', true) | string is match('^[0-9a-f]{64}$'))
          - >-
            homecluster_common_kernel_rollout_phase == 'rollback_last_phase'
            or (homecluster_common_kernel_accepted_pxe_release_manifest_sha256 | default('', true) | string is match('^[0-9a-f]{64}$'))
          - homecluster_common_kernel_rollback_selectors is mapping
        fail_msg: common-kernel rollout input contractが不正です
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted release identity pathを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_accepted_manifest_path: >-
          {{ openwrt_gentoo_release_bundle_manifest_dir | default('/srv/gentoo/releases', true) }}/{{ homecluster_common_kernel_accepted_selector | regex_replace('-rpi5$', '') }}.json
        homecluster_common_kernel_accepted_generic_kernel_path: >-
          /srv/gentoo/tftp-root/dates/{{ homecluster_common_kernel_accepted_selector }}/kernel8.img
        homecluster_common_kernel_accepted_published_payload_path: >-
          /srv/gentoo/rpi5-egpu-artifacts/{{ homecluster_common_kernel_accepted_selector }}/payload/kernel8-homecluster.img
        homecluster_common_kernel_accepted_pi5_default_kernel_path: >-
          /srv/gentoo/tftp-root/dates/{{ homecluster_common_kernel_accepted_selector }}/kernel_2712.img
        homecluster_common_kernel_accepted_nvidia_kernel_path: >-
          /srv/gentoo/tftp-root/dates/{{ homecluster_common_kernel_accepted_selector }}/kernel8-nvidia.img
        homecluster_common_kernel_accepted_nvidia_payload_path: >-
          /srv/gentoo/rpi5-egpu-artifacts/{{ homecluster_common_kernel_accepted_selector }}/payload/kernel8-nvidia.img
        homecluster_common_kernel_accepted_generic_dtb_path: >-
          /srv/gentoo/tftp-root/dates/{{ homecluster_common_kernel_accepted_selector }}/bcm2712-rpi-5-b.dtb
        homecluster_common_kernel_accepted_generic_dtb_payload_path: >-
          /srv/gentoo/rpi5-egpu-artifacts/{{ homecluster_common_kernel_accepted_selector }}/payload/bcm2712-rpi-5-b-homecluster.dtb
        homecluster_common_kernel_accepted_nvidia_dtb_path: >-
          /srv/gentoo/tftp-root/dates/{{ homecluster_common_kernel_accepted_selector }}/bcm2712-rpi-5-b-nvidia.dtb
        homecluster_common_kernel_accepted_nvidia_dtb_payload_path: >-
          /srv/gentoo/rpi5-egpu-artifacts/{{ homecluster_common_kernel_accepted_selector }}/payload/bcm2712-rpi-5-b-nvidia.dtb
        homecluster_common_kernel_accepted_module_tree_path: >-
          /srv/gentoo/{{ homecluster_common_kernel_accepted_selector }}/nfs/lib/modules/{{ homecluster_common_kernel_exact_release }}
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted PXE manifest identityを取得
      ansible.builtin.stat:
        path: "{{ homecluster_common_kernel_accepted_manifest_path }}"
        checksum_algorithm: sha256
        get_attributes: false
        get_mime: false
      register: homecluster_common_kernel_accepted_manifest_stat
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted PXE manifest driftを拒否
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_accepted_manifest_stat.stat.isreg | default(false)
          - homecluster_common_kernel_accepted_manifest_stat.stat.checksum | default('') == homecluster_common_kernel_accepted_pxe_release_manifest_sha256
        fail_msg: accepted PXE manifestのcontent identityが変化しています。selector mutation前にartifact driftを調査してください。
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted PXE manifestを読み込む
      ansible.builtin.slurp:
        src: "{{ homecluster_common_kernel_accepted_manifest_path }}"
      register: homecluster_common_kernel_accepted_manifest_content
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted PXE manifest metadataを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_accepted_live_manifest: >-
          {{ homecluster_common_kernel_accepted_manifest_content.content | b64decode | from_json }}
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted boot-critical artifact identityを取得
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_attributes: false
        get_mime: false
      loop:
        - "{{ homecluster_common_kernel_accepted_generic_kernel_path }}"
        - "{{ homecluster_common_kernel_accepted_published_payload_path }}"
        - "{{ homecluster_common_kernel_accepted_pi5_default_kernel_path }}"
        - "{{ homecluster_common_kernel_accepted_nvidia_kernel_path }}"
        - "{{ homecluster_common_kernel_accepted_nvidia_payload_path }}"
        - "{{ homecluster_common_kernel_accepted_generic_dtb_path }}"
        - "{{ homecluster_common_kernel_accepted_generic_dtb_payload_path }}"
        - "{{ homecluster_common_kernel_accepted_nvidia_dtb_path }}"
        - "{{ homecluster_common_kernel_accepted_nvidia_dtb_payload_path }}"
        - "{{ homecluster_common_kernel_accepted_module_tree_path }}"
      register: homecluster_common_kernel_accepted_boot_artifact_stats
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true

    - name: Pi5 common kernel accepted content identityを検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_accepted_live_manifest.schema | int == 1
          - homecluster_common_kernel_accepted_live_manifest.releases.rpi5 | default('') == homecluster_common_kernel_accepted_selector
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_release | default('') == homecluster_common_kernel_exact_release
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.common_kernel_artifact.id | default('') == homecluster_common_kernel_accepted_kernel_artifact_id
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.common_kernel_artifact.manifest_sha256 | default('') == homecluster_common_kernel_accepted_kernel_artifact_manifest_sha256
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.common_kernel_artifact.payload_sha256 | default('') == homecluster_common_kernel_accepted_kernel_artifact_payload_sha256
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256 | default('', true) | string is match('^[0-9a-f]{64}$')
          - homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.device_tree_sha256 | default('', true) | string is match('^[0-9a-f]{64}$')
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[0].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[0].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[1].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[1].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[2].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[2].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[3].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[3].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[4].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[4].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.kernel_image_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[5].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[5].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.device_tree_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[6].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[6].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.device_tree_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[7].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[7].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.device_tree_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[8].stat.isreg | default(false)
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[8].stat.checksum | default('') == homecluster_common_kernel_accepted_live_manifest.metadata.rpi5_nvidia.device_tree_sha256
          - homecluster_common_kernel_accepted_boot_artifact_stats.results[9].stat.isdir | default(false)
        fail_msg: accepted common-kernel boot artifact identityが変化しています。selector mutation前にartifact driftを調査してください。
      when: homecluster_common_kernel_rollout_phase != 'rollback_last_phase'
      changed_when: false
      no_log: true
    - name: Pi5 common kernel current PXE releaseをstage dateから解決
      ansible.builtin.include_role:
        name: openwrt_gentoo_rootfs
        tasks_from: pxe_host_releases
      tags:
        - always

    - name: Pi5 common kernel target current selectorを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_current_selectors: >-
          {%- set result = {} -%}
          {%- for item in openwrt_pxe_hosts_effective | default([]) -%}
          {%- set name = item.name | default('', true) | string | trim -%}
          {%- if name in homecluster_common_kernel_rollout_targets -%}
          {%- set _ = result.update({name: {
            'tftp_release': item.tftp_release | default('', true) | string | trim,
            'rootfs_release': item.rootfs_release | default(item.tftp_release | default('', true), true) | string | trim
          }}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ result }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel target selector存在を検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_current_selectors | length == homecluster_common_kernel_rollout_targets | length
          - item in homecluster_common_kernel_current_selectors
          - homecluster_common_kernel_current_selectors[item].tftp_release | string is match('^[0-9]{8}-rpi5$')
          - homecluster_common_kernel_current_selectors[item].rootfs_release | string is match('^[0-9]{8}-rpi5$')
        fail_msg: rollout targetの現在selectorを一意に解決できません
      loop: "{{ homecluster_common_kernel_rollout_targets }}"
      changed_when: false
      no_log: true

    - name: Pi5 common kernel applied selectorを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_applied_selectors: >-
          {%- set result = {} -%}
          {%- for name in homecluster_common_kernel_rollout_targets -%}
          {%- if homecluster_common_kernel_rollout_phase == 'rollback_last_phase' -%}
          {%- set previous = homecluster_common_kernel_rollback_selectors[name] | default({}) -%}
          {%- set _ = result.update({name: {
            'tftp_release': previous.tftp_release | default('', true) | string | trim,
            'rootfs_release': previous.rootfs_release | default('', true) | string | trim
          }}) -%}
          {%- else -%}
          {%- set _ = result.update({name: {
            'tftp_release': homecluster_common_kernel_accepted_selector,
            'rootfs_release': homecluster_common_kernel_accepted_selector
          }}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ result }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel planned selector mappingを検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_applied_selectors[item].tftp_release | string is match('^[0-9]{8}-rpi5$')
          - homecluster_common_kernel_applied_selectors[item].rootfs_release | string is match('^[0-9]{8}-rpi5$')
        fail_msg: applied selectorが固定release contractを満たしません
      loop: "{{ homecluster_common_kernel_rollout_targets }}"
      changed_when: false
      no_log: true

    - name: Pi5 common kernel selector変更要否を解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_selector_change_required: >-
          {{ homecluster_common_kernel_current_selectors != homecluster_common_kernel_applied_selectors }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel selector source pathを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_selector_source_paths: >-
          {%- set result = [] -%}
          {%- for item in homecluster_common_kernel_applied_selectors | dict2items -%}
          {%- set _ = result.append('/srv/gentoo/tftp-root/dates/' ~ item.value.tftp_release) -%}
          {%- set _ = result.append('/srv/gentoo/' ~ item.value.rootfs_release ~ '/nfs') -%}
          {%- endfor -%}
          {{ result }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel selector source artifactを確認
      ansible.builtin.stat:
        path: "{{ item }}"
        get_attributes: false
        get_checksum: false
        get_mime: false
      loop: "{{ homecluster_common_kernel_selector_source_paths }}"
      register: homecluster_common_kernel_selector_source_stats
      changed_when: false
      no_log: true

    - name: Pi5 common kernel missing selector source pathを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_missing_selector_source_paths: >-
          {%- set result = [] -%}
          {%- for item in homecluster_common_kernel_selector_source_stats.results | default([]) -%}
          {%- if not (item.stat.isdir | default(false)) -%}
          {%- set _ = result.append(item.item | string) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ result }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel selector source artifactを検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_missing_selector_source_paths | length == 0
        fail_msg: >-
          applied selectorのTFTPまたはrootfs sourceがありません:
          {{ homecluster_common_kernel_missing_selector_source_paths | join(',') }}
      changed_when: false

    - name: Pi5 common kernel modified PXE host listを作成
      ansible.builtin.set_fact:
        openwrt_pxe_hosts_effective_override: >-
          {%- set result = [] -%}
          {%- for item in openwrt_pxe_hosts_effective | default([]) -%}
          {%- set name = item.name | default('', true) | string | trim -%}
          {%- if name in homecluster_common_kernel_rollout_targets -%}
          {%- set selector = homecluster_common_kernel_applied_selectors[name] -%}
          {%- set _ = result.append(item | combine({
            'tftp_release': selector.tftp_release,
            'rootfs_release': selector.rootfs_release
          })) -%}
          {%- else -%}
          {%- set _ = result.append(item) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ result }}
      changed_when: false
      no_log: true

    - name: Pi5 common kernel rollback可能なpre-mutation planをcontrollerへ保存
      ansible.builtin.copy:
        dest: "{{ homecluster_common_kernel_rollout_output }}"
        mode: '0600'
        content: >-
          {{
            {
              'status': 'planned',
              'reason': 'selector_plan_recorded',
              'phase': homecluster_common_kernel_rollout_phase,
              'targets': homecluster_common_kernel_rollout_targets,
              'previous_selector_by_node': homecluster_common_kernel_current_selectors,
              'applied_selector_by_node': homecluster_common_kernel_applied_selectors,
              'accepted_generation_run_id': homecluster_common_kernel_accepted_generation_run_id,
              'exact_kernel_release': homecluster_common_kernel_exact_release
            } | to_json
          }}
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_remote_tmp: /tmp/homecluster-ansible-tmp
      changed_when: false
      no_log: true

    - name: Pi5 common kernel fixed PXE selectorを適用
      ansible.builtin.include_role:
        name: openwrt_gentoo_rootfs
        tasks_from: tftp_switch
      when: homecluster_common_kernel_selector_change_required | bool
      tags:
        - pxe_tftp_switch

    - name: Pi5 common kernel applied selectorを検証
      ansible.builtin.assert:
        that:
          - >-
            (
              openwrt_pxe_hosts_effective_override
              | selectattr('name', 'equalto', item)
              | map(attribute='tftp_release')
              | list
              | first
            ) == homecluster_common_kernel_applied_selectors[item].tftp_release
          - >-
            (
              openwrt_pxe_hosts_effective_override
              | selectattr('name', 'equalto', item)
              | map(attribute='rootfs_release')
              | list
              | first
            ) == homecluster_common_kernel_applied_selectors[item].rootfs_release
        fail_msg: applied selectorのpost-checkが不一致です
      loop: "{{ homecluster_common_kernel_rollout_targets }}"
      changed_when: false
      no_log: true

    - name: Pi5 common kernel target live selector entryを解決
      ansible.builtin.set_fact:
        homecluster_common_kernel_live_selector_entries: >-
          {{
            openwrt_gentoo_tftp_host_entries
            | default([])
            | selectattr('name', 'in', homecluster_common_kernel_rollout_targets)
            | list
          }}
      when: homecluster_common_kernel_selector_change_required | bool
      changed_when: false
      no_log: true

    - name: Pi5 common kernel target live selector entryを検証
      ansible.builtin.assert:
        that:
          - homecluster_common_kernel_live_selector_entries | length == homecluster_common_kernel_rollout_targets | length
          - item.name in homecluster_common_kernel_rollout_targets
          - item.release == homecluster_common_kernel_applied_selectors[item.name].tftp_release
          - item.rootfs_release == homecluster_common_kernel_applied_selectors[item.name].rootfs_release
        fail_msg: live selector post-check entryを一意に解決できません
      loop: "{{ homecluster_common_kernel_live_selector_entries }}"
      when: homecluster_common_kernel_selector_change_required | bool
      changed_when: false
      no_log: true

    - name: Pi5 common kernel OpenWrt live selectorを検証
      ansible.builtin.raw: |
        set -eu
        host_dir="/srv/gentoo/tftp-root/{{ item.board_hash }}"
        release="{{ item.release }}"
        rootfs_release="{{ item.rootfs_release }}"
        test "$(readlink "$host_dir/kernel8.img")" = "../dates/$release/kernel8.img"
        test "$(readlink "$host_dir/initramfs-pxe-v8.img")" = "../dates/$release/initramfs-pxe-v8.img"
        grep -F "root=nfs4:{{ openwrt_gentoo_server_host }}:/gentoo/$rootfs_release/nfs," \
          "$host_dir/cmdline.txt" >/dev/null
      loop: "{{ homecluster_common_kernel_live_selector_entries }}"
      loop_control:
        label: "{{ item.name }}"
      when: homecluster_common_kernel_selector_change_required | bool
      changed_when: false
      no_log: true

    - name: Pi5 common kernel selector apply resultをcontrollerへ保存
      ansible.builtin.copy:
        dest: "{{ homecluster_common_kernel_rollout_output }}"
        mode: '0600'
        content: >-
          {{
            {
              'status': 'applied',
              'reason': ('selector_applied' if homecluster_common_kernel_selector_change_required | bool else 'selector_already_aligned'),
              'phase': homecluster_common_kernel_rollout_phase,
              'targets': homecluster_common_kernel_rollout_targets,
              'previous_selector_by_node': homecluster_common_kernel_current_selectors,
              'applied_selector_by_node': homecluster_common_kernel_applied_selectors,
              'accepted_generation_run_id': homecluster_common_kernel_accepted_generation_run_id,
              'exact_kernel_release': homecluster_common_kernel_exact_release
            } | to_json
          }}
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_remote_tmp: /tmp/homecluster-ansible-tmp
      changed_when: false
      no_log: true
