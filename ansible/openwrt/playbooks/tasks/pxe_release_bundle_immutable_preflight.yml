---
- name: PXE release bundle immutable preflight入力を検証
  ansible.builtin.assert:
    that:
      - pxe_release_bundle_immutable_date | string is match('^[0-9]{8}$')
      - (openwrt_gentoo_release_bundle_manifest_dir | default('/srv/gentoo/releases', true) | string | trim | length) > 0
    fail_msg: immutable release preflightの入力が不正です
  changed_when: false

- name: PXE release bundle既存manifestを確認
  ansible.builtin.raw: |
    set -eu
    manifest="{{ openwrt_gentoo_release_bundle_manifest_dir | default('/srv/gentoo/releases', true) }}/{{ pxe_release_bundle_immutable_date }}.json"
    if [ -e "$manifest" ]; then
      printf '%s\n' "release_already_materialized"
      exit 42
    fi
  register: pxe_release_bundle_immutable_manifest_probe
  changed_when: false
  failed_when: false

- name: PXE release bundle既存releaseへの再buildを拒否
  ansible.builtin.assert:
    that:
      - pxe_release_bundle_immutable_manifest_probe.rc | int == 0
    fail_msg: >-
      release bundle {{ pxe_release_bundle_immutable_date }} は既にmanifestを持つため再buildできません。
      同じrelease pathを再利用せず、新しいstage date / release identityを使用してください。
  changed_when: false
