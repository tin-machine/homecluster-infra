---
- name: Portage distcc client 用ディレクトリを作成
  become: true
  ansible.builtin.file:
    path: /etc/portage/env
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - distcc_client_enabled | bool
  tags:
    - distcc_client

- name: Portage distcc client 用環境を配置
  become: true
  ansible.builtin.copy:
    dest: /etc/portage/env/enable-distcc
    owner: root
    group: root
    mode: "0644"
    content: |
      # Generated by ansible distcc
      FEATURES="${FEATURES} distcc"
  when:
    - distcc_client_enabled | bool
  tags:
    - distcc_client

- name: 無効な Portage distcc client 用環境を削除
  become: true
  ansible.builtin.file:
    path: /etc/portage/env/enable-distcc
    state: absent
  when:
    - not (distcc_client_enabled | bool)
  tags:
    - distcc_client

- name: make.conf の distcc client を有効化
  become: true
  ansible.builtin.replace:
    path: /etc/portage/make.conf
    regexp: '^(FEATURES="[^"\n]*)-distcc(?=\s|"$)'
    replace: '\1distcc'
  when:
    - distcc_client_enabled | bool
  tags:
    - distcc_client

- name: make.conf の distcc client を無効化
  become: true
  ansible.builtin.replace:
    path: /etc/portage/make.conf
    regexp: '^(FEATURES="[^"\n]*)(?<!-)distcc(?=\s|"$)'
    replace: '\1-distcc'
  when:
    - not (distcc_client_enabled | bool)
  tags:
    - distcc_client

- name: make.conf の distcc client 設定を取得
  become: true
  ansible.builtin.slurp:
    path: /etc/portage/make.conf
  register: distcc_make_conf
  tags:
    - distcc_client

- name: make.conf の distcc client 設定を検証
  ansible.builtin.assert:
    that:
      - >-
        (
          distcc_make_conf.content | b64decode
          | regex_search(
              '(?m)^FEATURES="[^"\\n]*(?<!-)distcc(?:\\s|"$)'
              if (distcc_client_enabled | bool)
              else '(?m)^FEATURES="[^"\\n]*-distcc(?:\\s|"$)'
            )
        ) is not none
    fail_msg: >-
      /etc/portage/make.conf の FEATURES を
      distcc.client_enabled={{ distcc_client_enabled | bool }} に収束できませんでした。
  tags:
    - distcc_client

- name: distcc 変数を検証
  ansible.builtin.assert:
    that:
      - distcc_port | int > 0
      - distcc_port | int < 65536
      - distcc_jobs | int > 0
      - distcc_nice | int >= 0
      - distcc_nice | int <= 20
      - distcc_allow | length > 0
    fail_msg: "distcc.enabled=true の host は port/jobs/nice/allow を有効な値にしてください"
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: distcc を導入
  become: true
  community.general.portage:
    package: "{{ distcc_package }}"
    state: present
    loadavg: "{{ [distcc_jobs | int, 4] | max }}"
  when:
    - distcc_enabled | bool or distcc_client_enabled | bool
  tags:
    - distcc_client
    - distcc_server

- name: distccd systemd drop-in ディレクトリを作成
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/distccd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: distccd systemd drop-in を配置
  become: true
  ansible.builtin.template:
    src: distccd-homecluster.conf.j2
    dest: /etc/systemd/system/distccd.service.d/10-homecluster.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart distccd
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: distccd を有効化して起動
  become: true
  ansible.builtin.systemd:
    name: distccd
    enabled: true
    state: started
    daemon_reload: true
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: distccd の listen 状態を確認
  become: true
  ansible.builtin.command: "ss -ltn sport = :{{ distcc_port }}"
  register: distccd_listen
  changed_when: false
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: distccd listen 確認結果を検証
  ansible.builtin.assert:
    that:
      - "'LISTEN' in (distccd_listen.stdout | default(''))"
    fail_msg: "distccd が TCP/{{ distcc_port }} で listen していません"
  when:
    - distcc_enabled | bool
  tags:
    - distcc_server

- name: 無効な distccd の service 情報を取得
  become: true
  ansible.builtin.service_facts:
  when:
    - not (distcc_enabled | bool)
  tags:
    - distcc_server

- name: 無効な distccd の homecluster drop-in を削除
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/distccd.service.d/10-homecluster.conf
    state: absent
  register: distccd_dropin_removed
  when:
    - not (distcc_enabled | bool)
  tags:
    - distcc_server

- name: distccd drop-in 削除後に systemd を再読込
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (distcc_enabled | bool)
    - distccd_dropin_removed.changed | default(false)
  tags:
    - distcc_server

- name: 無効な distccd を停止して自動起動を解除
  become: true
  ansible.builtin.systemd:
    name: distccd
    enabled: false
    state: stopped
  when:
    - not (distcc_enabled | bool)
    - "'distccd.service' in (ansible_facts.services | default({}))"
  tags:
    - distcc_server
