name: static-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v4 resolved on 2026-05-31.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="1.16.4"
          terraform_archive="terraform_${terraform_version}_linux_amd64.zip"
          terraform_url="https://releases.hashicorp.com/terraform/${terraform_version}/${terraform_archive}"
          terraform_sha256="dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df"
          install_dir="${RUNNER_TEMP}/terraform-bin"

          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location             "${terraform_url}"             --output "${RUNNER_TEMP}/${terraform_archive}"
          printf '%s  %s\n'             "${terraform_sha256}"             "${RUNNER_TEMP}/${terraform_archive}"             | sha256sum --check --strict -
          unzip -q "${RUNNER_TEMP}/${terraform_archive}" -d "${install_dir}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run static checks
        shell: bash
        env:
          RUN_TERRAFORM_VALIDATE: "1"
        run: bash scripts/ci/static-check.sh

      - name: Validate convergence monitor status
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-pi-k3s-status.sh

      - name: Validate convergence collector stdout stderr contract
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-collect-k3s-convergence.sh

      - name: Validate common-kernel rollout health diagnostics
        run: python3 -m unittest discover -s scripts -p 'test_pi_rpi5_common_kernel_rollout_health.py' -v

      - name: Validate SQLite encrypted backup fixtures
        run: python3 -m unittest discover -s scripts -p 'test_k3s_sqlite_backup.py' -v

      - name: Validate prod outside-in renderer and acceptance fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_outside_in*.py' -v

      - name: Validate staging /readyz scoped authentication fixtures
        run: python3 -m unittest discover -s scripts -p 'test_k3s_stg_readyz_anonymous.py' -v
