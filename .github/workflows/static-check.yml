name: static-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v4 resolved on 2026-05-31.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="1.16.4"
          terraform_archive="terraform_${terraform_version}_linux_amd64.zip"
          terraform_url="https://releases.hashicorp.com/terraform/${terraform_version}/${terraform_archive}"
          terraform_sha256="dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df"
          install_dir="${RUNNER_TEMP}/terraform-bin"

          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location             "${terraform_url}"             --output "${RUNNER_TEMP}/${terraform_archive}"
          printf '%s  %s\n'             "${terraform_sha256}"             "${RUNNER_TEMP}/${terraform_archive}"             | sha256sum --check --strict -
          unzip -q "${RUNNER_TEMP}/${terraform_archive}" -d "${install_dir}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run static checks
        shell: bash
        env:
          RUN_TERRAFORM_VALIDATE: "1"
        run: |
          terraform fmt -check -diff -recursive
          bash scripts/ci/static-check.sh

      - name: Validate PXE producer-consumer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/pxe-contract-venv"
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -m pip install 'ansible-core==2.20.1'
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ansible/test_builder_capacity_preflight.py
          PATH="${RUNNER_TEMP}/pxe-contract-venv/bin:${PATH}" \
            "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B \
            ansible/openwrt/roles/openwrt_banip/tests/test_refresh.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B \
            ansible/openwrt/roles/openwrt_security_monitor/tests/test_monitor.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ci/test_openwrt_security_otel.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B ansible/openwrt/roles/openwrt_security_capture/tests/test_capture.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ci/test_pxe_host_dtb_contract.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ci/test_host_tailscale_client_vars_contract.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ci/test_kernel_distcc_contract.py
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" -B scripts/ci/test_pxe_full_fleet_contract.py
          # Gate the actual Ansible YAML loader even though the optional full
          # ansible-playbook --syntax-check is not enabled on hosted CI.
          "${RUNNER_TEMP}/pxe-contract-venv/bin/python" - <<'PY'
          from ansible.parsing.dataloader import DataLoader

          paths = (
              "ansible/arm64/roles/common/change_make_conf/defaults/main.yml",
              "ansible/arm64/roles/common/change_make_conf/tasks/main.yml",
              "ansible/openwrt/roles/openwrt_gentoo_rootfs/defaults/main.yml",
              "ansible/openwrt/roles/openwrt_gentoo_rootfs/tasks/portage_chroot.yml",
              "ansible/openwrt/roles/openwrt_nfs_server/defaults/main.yml",
              "ansible/openwrt/roles/openwrt_nfs_server/tasks/main.yml",
          )
          loader = DataLoader()
          for path in paths:
              data = loader.load_from_file(path)
              if not isinstance(data, (dict, list)):
                  raise SystemExit(f"{path}: expected YAML mapping or list")

          defaults = loader.load_from_file(paths[0])
          expected = "{{ gentoo_binpkg_nfs_src | regex_replace('/binpkgs$', '/official-binhost-cache/gentoo') }}"
          assert defaults["gentoo_official_binhost_cache_nfs_src"] == expected, (
              "official binhost cache NFS source expression must be intact"
          )
          assert defaults["gentoo_chost"] == "aarch64-unknown-linux-gnu"
          assert "gentoo_profile_name" in defaults
          PY

      - name: Validate Namespace metadata with the locked Kubernetes provider
        shell: bash
        run: bash scripts/ci/check-kubernetes-namespace-metadata.sh

      - name: Validate CLI workspace retained storage and image pin
        shell: bash
        run: |
          terraform -chdir=terraform/env/staging init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/env/staging test -filter=tests/cli_workspace.tftest.hcl -no-color
          terraform -chdir=terraform/env/staging test -filter=tests/openwrt_security_logs.tftest.hcl -no-color

      - name: Validate staging Loki rendered storage and binary config
        run: bash scripts/ci/check-staging-loki-compat.sh

      - name: Validate convergence monitor status
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-pi-k3s-status.sh

      - name: Validate convergence collector stdout stderr contract
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-collect-k3s-convergence.sh

      - name: Validate common-kernel rollout health diagnostics
        run: python3 -m unittest discover -s scripts -p 'test_pi_rpi5_common_kernel_rollout_health.py' -v

      - name: Validate fixed PXE bundle manifest digest
        run: python3 -m unittest discover -s scripts -p 'test_pxe_bundle_manifest_readonly_status.py' -v

      - name: Validate fixed PXE node lineage read-only evidence
        run: python3 -m unittest discover -s scripts -p 'test_pxe_node_lineage_status.py' -v

      - name: Validate post-pull revision receipts
        run: python3 -m unittest discover -s scripts -p 'test_pxe_post_pull_receipt.py' -v

      - name: Validate fixed read-only post-pull receipt reader
        run: python3 -m unittest discover -s scripts -p 'test_pxe_post_pull_receipt_status.py' -v

      - name: Validate fixed read-only pinned playbook receipt reader
        run: python3 -m unittest discover -s scripts -p 'test_pxe_pinned_execution_status.py' -v

      - name: Validate SQLite encrypted backup fixtures
        run: python3 -m unittest discover -s scripts -p 'test_k3s_sqlite_backup.py' -v

      - name: Validate prod outside-in renderer and acceptance fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_outside_in*.py' -v

      - name: Validate prod Grafana renderer and provisioning fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_grafana_render.py' -v

      - name: Validate prod O3 alert rule source-only fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_alert_rules_render.py' -v

      - name: Validate prod O3-B Alertmanager Bot receiver fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_o3b_alertmanager_render.py' -v

      - name: Validate isolated prod O3-B Alertmanager image config
        run: python3 scripts/ci/check-prod-o3b-alertmanager-image.py

      - name: Validate prod O4 Loki backend source-only fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_o4_loki_render.py' -v

      - name: Validate isolated prod O4 Loki image config and loopback readiness
        run: bash scripts/ci/check-prod-o4-loki-image.sh

      - name: Validate prod O4 push gateway manifest fixtures
        run: python3 -m unittest discover -s scripts -p 'test_prod_o4_push_gateway_render.py' -v

      - name: Validate isolated prod O4 push gateway TLS and authentication
        run: bash scripts/ci/check-prod-o4-push-gateway-image.sh

      - name: Validate opt-in staging O4 container log sender
        run: python3 -m unittest discover -s scripts -p 'test_prod_o4_staging_log_sender.py' -v

      - name: Validate staging /readyz scoped authentication fixtures
        run: python3 -m unittest discover -s scripts -p 'test_k3s_stg_readyz_anonymous.py' -v
