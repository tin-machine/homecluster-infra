name: static-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v4 resolved on 2026-05-31.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        # hashicorp/setup-terraform v4 resolved on 2026-09-27.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Run static checks
        shell: bash
        env:
          RUN_TERRAFORM_VALIDATE: "1"
        run: bash scripts/ci/static-check.sh

      - name: Validate convergence monitor status
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-pi-k3s-status.sh

      - name: Validate convergence collector stdout stderr contract
        shell: bash
        run: bash .agents/skills/homecluster-convergence-monitor/scripts/test-collect-k3s-convergence.sh

      - name: Validate common-kernel rollout health diagnostics
        run: python3 -m unittest discover -s scripts -p 'test_pi_rpi5_common_kernel_rollout_health.py' -v
