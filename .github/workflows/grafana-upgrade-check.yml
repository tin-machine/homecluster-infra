name: grafana-upgrade-check

on:
  pull_request:
    paths:
      - '.github/workflows/grafana-upgrade-check.yml'
      - 'scripts/ci/*staging_grafana_upgrade.py'
      - 'terraform/modules/observability_stack/**'
      - 'clusters/homelab/apps/base/values-grafana.yaml'
      - 'clusters/homelab/apps/staging/values-grafana.yaml'
      - 'clusters/homelab/apps/base/grafana-dashboards/**'

permissions:
  contents: read

jobs:
  grafana-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Validate negative fixtures
        run: python3 -m unittest discover -s scripts/ci -p 'test_staging_grafana_upgrade.py' -v
      - name: Validate rendered contract and isolated SQLite upgrade
        run: python3 scripts/ci/check_staging_grafana_upgrade.py
